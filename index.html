<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🦊한서준 공지방 아카이빙</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <div class="archive">


        <!-- =========================
             상단 날짜 영역
        ========================== -->

        <header class="top-bar">


            <!-- 이전 날짜 -->

            <button
                id="prevDate"
                class="date-nav prev"
                aria-label="이전 날짜"
            >
                <span>◀</span>
            </button>


            <!-- 날짜 -->

          <div class="date-area">

    <button
        id="dateButton"
        class="date-button"
        type="button"
    >
        날짜
    </button>


   <!-- 날짜 선택 오버레이 -->

<div
    id="calendarOverlay"
    class="calendar-overlay"
>

    <div
        id="calendar"
        class="calendar"
    >

        <div class="calendar-months">

            <button
                class="month-button"
                data-month="3"
            >
                4월
            </button>

            <button
                class="month-button"
                data-month="4"
            >
                5월
            </button>

            <button
                class="month-button"
                data-month="5"
            >
                6월
            </button>

            <button
                class="month-button"
                data-month="6"
            >
                7월
            </button>

            <button
                class="month-button"
                data-month="7"
            >
                8월
            </button>

        </div>


        <div class="calendar-weekdays">

            <span>일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span>토</span>

        </div>


        <div
            id="calendarDays"
            class="calendar-days"
        ></div>

    </div>

</div>

        <div class="calendar-months">

            <button class="month-button" data-month="3">4월</button>
            <button class="month-button" data-month="4">5월</button>
            <button class="month-button" data-month="5">6월</button>
            <button class="month-button" data-month="6">7월</button>
            <button class="month-button" data-month="7">8월</button>

        </div>


        <div class="calendar-weekdays">
            <span>일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span>토</span>
        </div>


        <div
            id="calendarDays"
            class="calendar-days"
        ></div>

    </div>

</div>


            <!-- 다음 날짜 -->

            <button
                id="nextDate"
                class="date-nav next"
                aria-label="다음 날짜"
            >
                <span>▶</span>
            </button>


        </header>



        <!-- =========================
             대화 영역
        ========================== -->

        <main class="chat-container">

            <div
                id="chatMessages"
                class="chat-messages"
            >
                <!-- JavaScript가 메시지를 넣음 -->
            </div>

        </main>


    </div>


    <script src="js/script.js"></script>

</body>

</html>
