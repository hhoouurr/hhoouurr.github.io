<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>한서준🦊</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <div class="archive">


        <!-- =========================
             상단 날짜 영역
        ========================== -->

        <header class="top-bar">


            <!-- 이전 날짜 -->

            <button
                id="prevDate"
                class="date-nav prev"
                aria-label="이전 날짜"
            >
                <span>◀</span>
            </button>


            <!-- 날짜 -->

            <div class="date-area">

                <button
                    id="dateButton"
                    class="date-button"
                >
                    2021년 10월 7일 목요일
                </button>

                <!-- 실제 날짜 선택 input -->
                <input
                    type="date"
                    id="datePicker"
                    class="date-picker"
                >

            </div>


            <!-- 다음 날짜 -->

            <button
                id="nextDate"
                class="date-nav next"
                aria-label="다음 날짜"
            >
                <span>▶</span>
            </button>


        </header>



        <!-- =========================
             대화 영역
        ========================== -->

        <main class="chat-container">

            <div
                id="chatMessages"
                class="chat-messages"
            >
                <!-- JavaScript가 메시지를 넣음 -->
            </div>

        </main>


    </div>


    <script src="js/script.js"></script>

</body>

</html>
